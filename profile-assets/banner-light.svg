<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">gugu-eightyone — AI Engineer</title>
  <desc id="desc">Agent orchestration, retrieval, rules, and service connected as a workflow.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#0ea5a8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d8dee8" stroke-width="1" opacity=".42"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="26" fill="#f8fafc"/>
  <rect width="1200" height="300" rx="26" fill="url(#grid)"/>
  <rect x="0" y="0" width="10" height="300" rx="5" fill="url(#accent)"/>

  <g font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="72" fill="#6366f1" font-size="16" font-weight="700" letter-spacing="3">AI ENGINEER · LLM WORKFLOW &amp; RAG</text>
    <text x="68" y="147" fill="#111827" font-size="58" font-weight="760" letter-spacing="-2">gugu-eightyone</text>
    <text x="71" y="192" fill="#475569" font-size="20" font-weight="500">Agent orchestration · Retrieval · Reliable boundaries</text>
    <g transform="translate(70 230)">
      <rect width="132" height="34" rx="17" fill="#ede9fe"/>
      <text x="66" y="22" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="700">LANGGRAPH</text>
      <rect x="144" width="76" height="34" rx="17" fill="#ccfbf1"/>
      <text x="182" y="22" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="700">RAG</text>
      <rect x="232" width="104" height="34" rx="17" fill="#dbeafe"/>
      <text x="284" y="22" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">PYTHON</text>
    </g>
  </g>

  <g transform="translate(690 47)" filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <path d="M112 48 C175 48 160 104 224 104" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M112 104 H224" fill="none" stroke="#14b8a6" stroke-width="3"/>
    <path d="M112 160 C175 160 160 104 224 104" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <path d="M334 104 H390" fill="none" stroke="url(#accent)" stroke-width="4"/>

    <g>
      <rect x="0" y="25" width="112" height="46" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
      <circle cx="22" cy="48" r="6" fill="#8b5cf6"/>
      <text x="62" y="54" text-anchor="middle" fill="#374151" font-size="13" font-weight="700">AGENTS</text>
    </g>
    <g>
      <rect x="0" y="81" width="112" height="46" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
      <circle cx="22" cy="104" r="6" fill="#14b8a6"/>
      <text x="62" y="110" text-anchor="middle" fill="#374151" font-size="13" font-weight="700">RAG</text>
    </g>
    <g>
      <rect x="0" y="137" width="112" height="46" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="22" cy="160" r="6" fill="#3b82f6"/>
      <text x="62" y="166" text-anchor="middle" fill="#374151" font-size="13" font-weight="700">RULES</text>
    </g>
    <g>
      <rect x="224" y="76" width="110" height="56" rx="18" fill="url(#accent)"/>
      <text x="279" y="110" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">WORKFLOW</text>
    </g>
    <g>
      <rect x="390" y="76" width="102" height="56" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <text x="441" y="110" text-anchor="middle" fill="#111827" font-size="14" font-weight="800">SERVICE</text>
    </g>
  </g>
