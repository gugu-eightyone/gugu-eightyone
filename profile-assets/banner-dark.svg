      <rect x="144" width="76" height="34" rx="17" fill="#123f3b"/>
      <text x="182" y="22" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">RAG</text>
      <rect x="232" width="104" height="34" rx="17" fill="#172f52"/>
      <text x="284" y="22" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">PYTHON</text>
    </g>
  </g>

  <g transform="translate(690 47)" filter="url(#glow)" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <path d="M112 48 C175 48 160 104 224 104" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <path d="M112 104 H224" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M112 160 C175 160 160 104 224 104" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <path d="M334 104 H390" fill="none" stroke="url(#accent)" stroke-width="4"/>

    <g>
      <rect x="0" y="25" width="112" height="46" rx="14" fill="#161b22" stroke="#6d5da8" stroke-width="2"/>
      <circle cx="22" cy="48" r="6" fill="#a78bfa"/>
      <text x="62" y="54" text-anchor="middle" fill="#d8dee7" font-size="13" font-weight="700">AGENTS</text>
    </g>
    <g>
      <rect x="0" y="81" width="112" height="46" rx="14" fill="#161b22" stroke="#277d73" stroke-width="2"/>
      <circle cx="22" cy="104" r="6" fill="#2dd4bf"/>
      <text x="62" y="110" text-anchor="middle" fill="#d8dee7" font-size="13" font-weight="700">RAG</text>
    </g>
    <g>
      <rect x="0" y="137" width="112" height="46" rx="14" fill="#161b22" stroke="#3f6ea6" stroke-width="2"/>
      <circle cx="22" cy="160" r="6" fill="#60a5fa"/>
      <text x="62" y="166" text-anchor="middle" fill="#d8dee7" font-size="13" font-weight="700">RULES</text>
