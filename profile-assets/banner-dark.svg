<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">gugu-eightyone — AI Engineer</title>
  <desc id="desc">Agent orchestration, retrieval, rules, and service connected as a workflow.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity=".55"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="14" flood-color="#8b5cf6" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="26" fill="#0d1117"/>
  <rect width="1200" height="300" rx="26" fill="url(#grid)"/>
  <rect x="0" y="0" width="10" height="300" rx="5" fill="url(#accent)"/>

  <g font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="72" fill="#a78bfa" font-size="16" font-weight="700" letter-spacing="3">AI ENGINEER · LLM WORKFLOW &amp; RAG</text>
    <text x="68" y="147" fill="#f0f6fc" font-size="58" font-weight="760" letter-spacing="-2">gugu-eightyone</text>
    <text x="71" y="192" fill="#9da7b3" font-size="20" font-weight="500">Agent orchestration · Retrieval · Reliable boundaries</text>
    <g transform="translate(70 230)">
